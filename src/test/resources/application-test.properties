# R2DBC (reactivo) - formato correto para mem
spring.r2dbc.url=r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.r2dbc.username=sa
spring.r2dbc.password=

# Flyway (JDBC) - formato correto (sem "///")
spring.flyway.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.flyway.user=sa
spring.flyway.password=
spring.flyway.enabled=true

# Use classpath para funcionar no teste e no JAR
spring.flyway.locations=classpath:db/migration

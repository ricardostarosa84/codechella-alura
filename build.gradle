plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.alura'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Starter base do Spring Boot (traz spring-boot, autoconfigure e anotações)
	implementation 'org.springframework.boot:spring-boot-starter'

	// WebFlux (reativo) e R2DBC (relacional reativo)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'

	// (Opcional) força presença explícita das anotações de Spring Data Relational
	implementation 'org.springframework.data:spring-data-relational'

	// Migrações de banco (Flyway) com Postgres
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// JDBC (necessário para Flyway, que usa JDBC)
	implementation 'org.springframework:spring-jdbc'

	// Drivers
	runtimeOnly 'org.postgresql:postgresql'           // JDBC (Flyway)
	runtimeOnly 'org.postgresql:r2dbc-postgresql'     // R2DBC (runtime reativo)

	// Testes
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'io.r2dbc:r2dbc-h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

